# pm-recorder configuration. Relative paths are resolved against this file's directory.
data_dir = "../../data/live"

[log]
level = "info"                     # error | warn | info | debug; RUST_LOG overrides
dir = "../../data/logs"            # also log to <dir>/YYYY/MM/DD/record.log; "" = stdout only
status_secs = 60                   # status report period

[store]
zstd_level = 9        # 3 = faster, 9+ = smaller; 6 compresses the CLOB feed ~10x
flush_secs = 5        # max data lost on a crash

[discovery]
interval_secs = 60            # Gamma poll period; new markets are subscribed within this
end_date_lookback_hours = 24
ended_grace_secs = 1800       # keep recording 30 min after Gamma marks an event ended
max_days_ahead = 7            # skip events starting later than this (0 = no limit); futures unaffected

# Data goes to <data_dir>/<YYYY>/<MM>/<DD>/<category>/<key>/<stream>/<HH>.r<run>.jsonl.zst
# Each league is found by tag_id and/or series_id (both from https://gamma-api.polymarket.com/sports):
#   tag_id    = primaryTagId: every event of the league, incl. futures and props (the `cs2` tag
#               slug is NOT the CS2 league tag)
#   series_id = series: match events only. Needed for Serie A, Champions League and tennis, whose
#               matches do not carry the primary tag.
# include_types / exclude_types filter on sportsMarketType; empty include = everything.
# games_only = true skips events without a start time / game id (futures).
# score_league: the live-score feed's leagueAbbreviation, if it differs from `key`.
[[leagues]]
category = "esports"
key = "cs2"
tag_id = 100780

[[leagues]]
category = "esports"
key = "dota2"
tag_id = 102366

[[leagues]]
category = "esports"
key = "lol"
tag_id = 65

[[leagues]]
category = "esports"
key = "val"  # valorant
tag_id = 101672

[[leagues]]
category = "esports"
key = "r6seige"  # rainbow 6 seige
tag_id = 102755

# ---------------------------------------------------------------------------------------------
# Sports: match markets only (series_id), main market types only. Player props, exact scores,
# corners etc. are ~10x the markets for ~1% of the volume. Volumes are 24h, measured 2026-10-17.
# See docs/pmd/leagues.md.

# US football. NFL ~$0.8M/day, CFB ~$9.6M/day on game markets (CFB alone ~7.6k markets: many
# alternative spread/total lines per game).
[[leagues]]
category = "sports"
key = "nfl"
series_id = 12185
include_types = ["moneyline", "spreads", "totals", "first_half_moneyline", "first_half_spreads", "first_half_totals"]

[[leagues]]
category = "sports"
key = "cfb"
series_id = 12756
include_types = ["moneyline", "spreads", "totals"]

