[clob]
enabled = true
max_assets_per_conn = 500
custom_features = true        # also best_bid_ask / new_market / market_resolved
book_snapshot_secs = 60       # top-of-book snapshot of each changed book (0 = off)
book_snapshot_levels = 50
keep_hashes = false          # true keeps price_change "hash" fields (3x the size)

[activity]
enabled = true
only_tracked = true           # false = also record every other trade, under other/untracked

[sports]
enabled = true
leagues = []                  # leagueAbbreviation filter; empty = all leagues (small feed).
                              # Unconfigured leagues are stored under other/<leagueAbbreviation>.
